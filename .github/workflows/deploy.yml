name: Build & Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.SHA_SHORT }}
      ghcr_prefix: ${{ steps.sha.outputs.GHCR_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA and image prefix
        id: sha
        run: |
          echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "GHCR_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Client (frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.sha.outputs.GHCR_PREFIX }}-client:${{ steps.sha.outputs.SHA_SHORT }}
            ${{ steps.sha.outputs.GHCR_PREFIX }}-client:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://inventory.acronix.in/api
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      - name: Build & Push API (backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.sha.outputs.GHCR_PREFIX }}-api:${{ steps.sha.outputs.SHA_SHORT }}
            ${{ steps.sha.outputs.GHCR_PREFIX }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /opt/inventory/scripts

      - name: Copy deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "scripts/deploy.sh,docker-compose.yml"
          target: /opt/inventory
          strip_components: 0
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            mv /opt/inventory/scripts/deploy.sh /opt/inventory/deploy.sh
            chmod +x /opt/inventory/deploy.sh
            sed -i 's/\r$//' /opt/inventory/deploy.sh
            sed -i 's/\r$//' /opt/inventory/docker-compose.yml
            /opt/inventory/deploy.sh \
              "${{ needs.build-and-push.outputs.sha_short }}" \
              "${{ needs.build-and-push.outputs.ghcr_prefix }}" \
              "${{ secrets.SLACK_WEBHOOK }}"
